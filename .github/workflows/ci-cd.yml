name: Identio PHP SDK CI/CD

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-cd.yml"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml"
      - "src/**"
      - "tests/**"
  workflow_dispatch:
    inputs:
      release_type:
        description: Version increment to publish after the tests pass
        type: choice
        required: true
        default: patch
        options: [none, patch, minor, major]

concurrency:
  group: identio-sdk-${{ github.ref }}
  cancel-in-progress: false

env:
  MIRROR_ROOT: /home/github-runner/git-mirrors/php

jobs:
  test:
    name: Test SDK
    runs-on: [self-hosted, linux, x64, staging1-runner]
    permissions:
      contents: read
    steps:
      - name: Checkout from runner-local mirror
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY##*/}"
          mirror_path="${MIRROR_ROOT}/${repo_name}.git"
          remote_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          ref_name="refs/codex/${GITHUB_RUN_ID}/${GITHUB_JOB}/self"

          mkdir -p "${MIRROR_ROOT}"
          if [ ! -d "${mirror_path}" ]; then
            git clone --mirror "${remote_url}" "${mirror_path}"
          else
            git -C "${mirror_path}" remote set-url origin "${remote_url}"
          fi
          git -C "${mirror_path}" fetch --prune --tags origin "+${GITHUB_REF}:${ref_name}"

          rm -rf "${GITHUB_WORKSPACE}/.git"
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init "${GITHUB_WORKSPACE}"
          git -C "${GITHUB_WORKSPACE}" remote add origin "${mirror_path}"
          git -C "${GITHUB_WORKSPACE}" fetch --no-tags origin "${ref_name}"
          git -C "${GITHUB_WORKSPACE}" checkout --force FETCH_HEAD

      - name: Verify PHP and Composer
        run: |
          set -euo pipefail
          command -v php
          command -v composer
          php -r 'exit(version_compare(PHP_VERSION, "8.2.0", ">=") ? 0 : 1);'
          php -v
          composer --version

      - name: Validate dependencies
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-scripts --no-plugins --no-interaction --prefer-dist --no-progress

      - name: Run SDK tests
        run: vendor/bin/phpunit

  release:
    name: Tag Composer release and notify PortalKit
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release_type != 'none'))
    runs-on: [self-hosted, linux, x64, staging1-runner]
    permissions:
      contents: write
    env:
      RELEASE_TYPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_type || 'patch' }}
      PORTALKIT_DISPATCH_TOKEN: ${{ secrets.PORTALKIT_DISPATCH_TOKEN }}
    steps:
      - name: Checkout from runner-local mirror
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY##*/}"
          mirror_path="${MIRROR_ROOT}/${repo_name}.git"
          remote_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          ref_name="refs/codex/${GITHUB_RUN_ID}/${GITHUB_JOB}/self"

          mkdir -p "${MIRROR_ROOT}"
          if [ ! -d "${mirror_path}" ]; then
            git clone --mirror "${remote_url}" "${mirror_path}"
          else
            git -C "${mirror_path}" remote set-url origin "${remote_url}"
          fi
          git -C "${mirror_path}" fetch --prune --tags origin "+${GITHUB_REF}:${ref_name}"

          rm -rf "${GITHUB_WORKSPACE}/.git"
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init "${GITHUB_WORKSPACE}"
          git -C "${GITHUB_WORKSPACE}" remote add origin "${mirror_path}"
          git -C "${GITHUB_WORKSPACE}" fetch --no-tags origin "${ref_name}"
          git -C "${GITHUB_WORKSPACE}" fetch --tags origin
          git -C "${GITHUB_WORKSPACE}" checkout --force FETCH_HEAD

      - name: Calculate next semantic version
        id: version
        run: |
          set -euo pipefail
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n1)"
          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
          fi
          version="${latest_tag#v}"
          IFS=. read -r major minor patch <<EOF
          $version
          EOF
          case "$RELEASE_TYPE" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
            *)
              echo "Unsupported release type: $RELEASE_TYPE" >&2
              exit 1
              ;;
          esac
          release_version="v${major}.${minor}.${patch}"
          if git rev-parse -q --verify "refs/tags/${release_version}" >/dev/null; then
            echo "Tag already exists: ${release_version}" >&2
            exit 1
          fi
          echo "version=${release_version}" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_VERSION" -m "Release $RELEASE_VERSION"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RELEASE_VERSION"

      - name: Notify PortalKit about the published SDK
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${PORTALKIT_DISPATCH_TOKEN}" ]; then
            echo "Missing PORTALKIT_DISPATCH_TOKEN secret." >&2
            exit 1
          fi
          payload="$(printf '{"event_type":"dependency-released","client_payload":{"dependency":"identio/php-sdk","version":"%s","source_repository":"%s"}}' "$RELEASE_VERSION" "$GITHUB_REPOSITORY")"
          curl --fail --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${PORTALKIT_DISPATCH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            https://api.github.com/repos/PortalKit/portalkit-composer/dispatches
